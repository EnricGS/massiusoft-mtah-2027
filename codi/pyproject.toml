[project]
name = "hackathon-codi"
version = "0.1.0"
description = "More than a Hack 2027, Phase 1: team possession per video frame"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kloppy>=3.19.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["possessio", "cadena", "banc", "inspeccio", "pilota", "mesura"]

[tool.pytest.ini_options]
testpaths = ["cadena/tests", "banc/tests", "inspeccio/tests", "pilota/tests", "mesura/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
