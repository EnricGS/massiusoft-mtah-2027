<svg viewBox="0 0 672 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="decoder-title decoder-desc" id="decoder-root">
  <title id="decoder-title">Two minutes of a bench match: the truth, the Smart Tagging, frame by frame, and decoded</title>
  <desc id="decoder-desc">Six strips over two minutes of metrica-2, half 2, with mixed ball gaps and a quarter of the assumed position error: the true labels, at the first touch; the simulated Smart Tagging at the medium level, with each tagged phase in the light colour of its team and the set pieces in grey; the model&#x27;s most likely class per frame, with the Smart Tagging added and dead ball ruled out where the ball was cleaned away; q, the probability that the team changes nearby, darker where it is higher; the same through the decoder (switch cost 4 times minus log q, cost 32 to and from dead ball, minimum length 12 frames); and the frames with no usable ball, missing or cleaned away.</desc>
